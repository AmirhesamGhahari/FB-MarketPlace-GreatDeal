category_key: windows_laptop
category_name: Windows Laptop
product_type: Laptop
brand: Various

sources:
  facebook_legacy:
    enabled: true
    actor_id: "raidr-api/facebook-marketplace-scraper"
    radius_km: "100"

    proxy:
      use_apify_proxy: true
      apify_proxy_groups: ["RESIDENTIAL"]
      apify_proxy_country: "CA"

    search_terms:
      - dell xps 13
      - dell xps 15
      - lenovo thinkpad
      - lenovo ideapad
      - hp spectre x360
      - hp envy
      - asus zenbook
      - asus vivobook
      - microsoft surface pro
      - surface laptop

    initial_run:
      cities:
        - "Toronto, Ontario"
      use_deduplication: true
      fetch_detailed_items: true
      listings_per_search: 200
      filter_keywords: "laptop"
      actor_timeout_secs: 10800
      actor_memory_mb: 4096

    periodic_run:
      cities:
        - "Toronto, Ontario"
      use_deduplication: true
      fetch_detailed_items: true
      listings_per_search: 70
      days_listed: "7"
      filter_keywords: "laptop"
      actor_timeout_secs: 7200
      actor_memory_mb: 2048
