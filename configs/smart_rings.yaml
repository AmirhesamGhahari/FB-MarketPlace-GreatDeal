category_key: smart_rings
category_name: Smart Rings
product_type: Smart Rings
brand: Various

sources:
  facebook_legacy:
    enabled: true
    actor_id: "raidr-api/facebook-marketplace-scraper"
    radius_km: "100"

    proxy:
      use_apify_proxy: true
      apify_proxy_groups: ["RESIDENTIAL"]
      apify_proxy_country: "CA"

    search_terms:
      - oura ring gen 4
      - oura ring gen 5
      - oura ring gen 3
      - ringconn gen 2 Air
      - ringconn gen 2
      - samsung galaxy ring
      - ultrahuman ring air
      - ultrahuman ring pro

    initial_run:
      cities:
        - "Toronto, Ontario"
      use_deduplication: true
      fetch_detailed_items: true
      listings_per_search: 200
      filter_keywords: "ring"
      actor_timeout_secs: 7200 
      actor_memory_mb: 2048

    periodic_run:
      cities:
        - "Toronto, Ontario"
      use_deduplication: true
      fetch_detailed_items: true
      listings_per_search: 60
      days_listed: "7"
      filter_keywords: "ring"
      actor_timeout_secs: 7200    
      actor_memory_mb: 2048
