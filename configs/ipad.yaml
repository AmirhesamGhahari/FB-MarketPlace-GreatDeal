category_key: ipad
category_name: iPad
product_type: Tablet
brand: Apple

sources:
  facebook_legacy:
    enabled: true
    actor_id: "raidr-api/facebook-marketplace-scraper"
    radius_km: "100"

    proxy:
      use_apify_proxy: true
      apify_proxy_groups: ["RESIDENTIAL"]
      apify_proxy_country: "CA"

    search_terms:
      - ipad pro m4
      - ipad pro m2
      - ipad pro 12.9
      - ipad pro 11
      - ipad air m2
      - ipad air m3
      - ipad air m4
      - ipad mini
      - ipad 11
      - ipad 10
      - ipad 9th

    initial_run:
      cities:
        - "Toronto, Ontario"
      use_deduplication: true
      fetch_detailed_items: true
      listings_per_search: 200
      filter_keywords: "ipad"
      actor_timeout_secs: 10800
      actor_memory_mb: 4096

    periodic_run:
      cities:
        - "Toronto, Ontario"
      use_deduplication: true
      fetch_detailed_items: true
      listings_per_search: 70
      days_listed: "7"
      filter_keywords: "ipad"
      actor_timeout_secs: 7200
      actor_memory_mb: 2048
