category_key: iphone
category_name: iPhone
product_type: Smartphone
brand: Apple

sources:
  facebook_legacy:
    enabled: true
    actor_id: "raidr/facebook-marketplace-scraper"
    radius_km: "100"

    proxy:
      use_apify_proxy: true
      apify_proxy_groups: ["RESIDENTIAL"]
      apify_proxy_country: "CA"

    search_terms:
      - iphone 16 pro
      - iphone 16 pro max
      - iphone 16
      - iphone 16 plus
      - iphone 15 pro
      - iphone 15 pro max
      - iphone 15
      - iphone 14 pro
      - iphone 14
      - iphone 13 pro
      - iphone 13
      - iphone 17
      - iphone 17 pro
      - iphone 17 pro max

    initial_run:
      cities:
        - "Toronto, Ontario"
      use_deduplication: false
      fetch_detailed_items: false
      listings_per_search: 500
      filter_keywords: "iphone"

    periodic_run:
      cities:
        - "Toronto, Ontario"
      use_deduplication: true
      fetch_detailed_items: false
      listings_per_search: 100
      days_listed: "7"
      filter_keywords: "iphone"
