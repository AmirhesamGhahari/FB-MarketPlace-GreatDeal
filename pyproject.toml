[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fb-marketplace-greatdeals"
version = "0.1.0"
description = "FB Marketplace Great Deals Intelligence Platform — Backend Pipeline"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "loguru>=0.7",
    "rich>=13.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "apify-client>=1.7",
    "pyyaml>=6.0",
    "google-genai>=1.0",
    "httpx>=0.27",
]

[project.scripts]
run-facebook = "fb_marketplace_greatdeals.sources.facebook_legacy.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/fb_marketplace_greatdeals"]
