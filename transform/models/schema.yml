sources:
  - name: public
    tables:
      - name: categories

  - name: facebook
    schema: facebook
    tables:
      - name: fb_listings_raw
      - name: fb_listings_classified

models:
  - name: dim_classified_listings
    description: "All current FB Marketplace listings joined with Gemini classifications. Base model — all category dims and fact tables read from here via ref()."
    columns:
      - name: fb_listing_id
        tests: [unique, not_null]
      - name: raw_listing_id
        tests: [unique, not_null]
      - name: classified_at
        tests: [not_null]
      - name: category_key
        tests: [not_null]
      - name: listing_type
        tests:
          - accepted_values:
              values: ['smartphone', 'laptop', 'tablet', 'gaming_console', 'smartwatch', 'earbuds', 'smart_ring', 'case', 'accessory', 'parts', 'box_only', 'buyer_post', 'multiple_items', 'other']

  - name: dim_categories
    description: "Lookup table of all product categories."
    columns:
      - name: category_key
        tests: [unique, not_null]
      - name: category_id
        tests: [unique, not_null]

  - name: dim_product_stats
    description: "Aggregated market value and deal stats per product (category + brand + model + variant + storage). Only relevant listings included."
    columns:
      - name: product_model
        tests: [unique, not_null]

  - name: dim_iphones
    description: "Relevant iPhone listings only (is_relevant_listing = true, category_key = 'iphone')."
    columns:
      - name: listing_key
        tests: [unique, not_null]
      - name: fb_listing_id
        tests: [unique, not_null]

  - name: dim_macbooks
    description: "Relevant MacBook listings only (is_relevant_listing = true, category_key = 'macbook')."
    columns:
      - name: listing_key
        tests: [unique, not_null]
      - name: fb_listing_id
        tests: [unique, not_null]

  - name: dim_airpods
    description: "Relevant AirPods listings only (is_relevant_listing = true, category_key = 'airpods')."
    columns:
      - name: listing_key
        tests: [unique, not_null]
      - name: fb_listing_id
        tests: [unique, not_null]

  - name: dim_apple_watches
    description: "Relevant Apple Watch listings only (is_relevant_listing = true, category_key = 'apple_watch')."
    columns:
      - name: listing_key
        tests: [unique, not_null]
      - name: fb_listing_id
        tests: [unique, not_null]

  - name: dim_gaming_consoles
    description: "Relevant gaming console listings only (is_relevant_listing = true, category_key = 'gaming_console')."
    columns:
      - name: listing_key
        tests: [unique, not_null]
      - name: fb_listing_id
        tests: [unique, not_null]

  - name: dim_samsung_galaxies
    description: "Relevant Samsung Galaxy listings only (is_relevant_listing = true, category_key = 'samsung_galaxy')."
    columns:
      - name: listing_key
        tests: [unique, not_null]
      - name: fb_listing_id
        tests: [unique, not_null]

  - name: dim_smart_rings
    description: "Relevant smart ring listings only (is_relevant_listing = true, category_key = 'smart_rings')."
    columns:
      - name: listing_key
        tests: [unique, not_null]
      - name: fb_listing_id
        tests: [unique, not_null]

  - name: dim_windows_laptops
    description: "Relevant Windows laptop listings only (is_relevant_listing = true, category_key = 'windows_laptop')."
    columns:
      - name: listing_key
        tests: [unique, not_null]
      - name: fb_listing_id
        tests: [unique, not_null]

  - name: fct_products_daily
    description: "One row per product_model and stat_date (listed_at date), one row per day from the product's first listing date through today. Cumulative and rolling 30d/7d/3d/1d listing counts and average prices (windows include stat_date), the same for deal_score >= 8 (deal8_ prefix), and the 5 lowest-priced listings per rolling window (lowest_5_deals_*, a jsonb array of {listing_id, url, price}, cheapest first). Also tenth_cheapest_price_7d (10th cheapest price in the 7 days ending stat_date, null if fewer than 10 listings) and cutoff_price_cheapest_10pct_30d (highest price in the cheapest decile over 30 days). The deal8_lowest_5_deals_*, deal8_tenth_cheapest_price_7d and deal8_cutoff_price_cheapest_10pct_30d columns repeat these using only listings with deal_score >= 8. tenth_cheapest_price_30d and cutoff_price_cheapest_10pct_7d (and their deal8_ versions) are the 30-day 10th cheapest price and the 7-day cheapest-decile cutoff. Listings with implausible prices are excluded."
    columns:
      - name: product_model
        tests: [not_null]
      - name: stat_date
        tests: [not_null]

  - name: fct_deal_candidates
    description: "One row per fb_listing_id: the evaluation of the listing's latest version. A listing is evaluated when it first appears in dim_classified_listings, and evaluated again (the row is replaced) when it gets a new version or is re-classified, always against its product's benchmarks from the day before it was listed. Eight rule columns are kept side by side for comparison: hit_tenth_cheapest_7d/30d and hit_cheapest_decile_7d/30d, plus the same four with the deal8_ prefix (benchmark built from score >= 8 listings, listing's own score must be >= 8). skip_reason (old_record, outlier, no_benchmark, insufficient_history, stale_benchmark) is set when the listing must not be alerted on. Never full-refreshed (full_refresh=false). Read by the notify stage."
    columns:
      - name: fb_listing_id
        tests: [unique, not_null]
      - name: raw_listing_id
        tests: [unique, not_null]
