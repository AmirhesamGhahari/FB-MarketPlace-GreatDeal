name: fb_marketplace
version: '1.0.0'
profile: fb_marketplace

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  lookback_days: 3
  benchmark_start_date: '2026-08-01'
  chart_days: 60
  listings_days: 60
  top_deals_per_product: 10

# tests only warn: a data-quality problem is reported but never blocks the pipeline
data_tests:
  +severity: warn

models:
  fb_marketplace:
    transformed:
      +materialized: table
    serving:
      +schema: serving
      +materialized: table
